name: Test Korea Price Sources

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FinanceDataReader
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader

      - name: Test Korean securities
        run: python scripts/test_korea_prices.py
