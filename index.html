<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Portfolio Control v3</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="v33-views.css">
<link rel="stylesheet" href="v33-dashboard.css">
<link rel="stylesheet" href="v33-ui.css">
<link rel="stylesheet" href="v33-tabs.css">
<link rel="stylesheet" href="v33-ops.css">
<link rel="stylesheet" href="v33-ops-ux.css">
<link rel="stylesheet" href="v33-life-final.css">
</head>
<body>
<div id="authShell" class="authShell">
  <div class="authCard">
    <h1>📊 Portfolio Control v3</h1>
    <div class="small">GitHub Pages + Supabase 동기화</div>
    <div class="authGrid">
      <label>이메일<input id="authEmail" type="email" autocomplete="username" placeholder="name@example.com"></label>
      <label>비밀번호<input id="authPassword" type="password" autocomplete="current-password" placeholder="비밀번호"></label>
      <div class="actions"><button class="btn primary" onclick="signIn()">로그인</button><button class="btn" onclick="signUp()">처음 가입</button></div>
    </div>
    <div id="authMsg" class="authMsg">Supabase 연결을 확인하는 중입니다.</div>
    <div class="note">처음 가입 후 이메일 확인이 활성화되어 있으면 확인 메일의 링크를 한 번 누른 뒤 로그인하세요.</div>
  </div>
</div>
<div class="wrap" id="appWrap" style="display:none">
<div class="top"><div><h1>📊 Portfolio Control v3</h1><div class="small" id="dateLabel"></div></div><div class="topRight"><span class="cloudLabel" id="cloudStatus"><i class="syncDot"></i>연결 중</span><button class="btn v33-mobile-top-btn" onclick="exportData()">백업</button><label class="btn v33-mobile-top-btn">복원<input type="file" accept="application/json" hidden onchange="importData(this.files[0])"></label><button class="btn v33-mobile-top-btn" onclick="signOut()">로그아웃</button></div></div>
<div class="tabs" id="tabs"></div><div id="content"></div>
<div class="footer">v3 · 현재가는 시장가격 탭에서만 입력합니다. Supabase가 원본이며 localStorage는 최근 캐시입니다. 계좌번호·주민번호·로그인정보는 저장하지 마세요.</div>
</div>
<div class="modalBack" id="tableModal" onclick="if(event.target===this)closeTableModal()"><div class="modalPanel"><div class="modalHead"><div class="modalTitle" id="tableModalTitle">상세표</div><button class="modalClose" onclick="closeTableModal()">닫기</button></div><div class="modalBody" id="tableModalBody"></div></div></div>
